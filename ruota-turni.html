<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#0b1119">
  <title>Ruota Virtuale</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;display:grid;place-items:center;padding:28px;background:radial-gradient(circle at 50% 10%,#192537 0,#0b1119 48%,#070a0f 100%);color:#f7f9fc}
    main{width:min(540px,100%);padding:42px 34px;text-align:center;background:rgba(19,28,41,.88);border:1px solid #314158;border-radius:28px;box-shadow:0 24px 70px rgba(0,0,0,.42)}
    .segno{width:62px;height:62px;margin:0 auto 24px;display:grid;place-items:center;border-radius:19px;background:#ff7626;color:#111927;font-size:31px;font-weight:900;box-shadow:0 12px 30px rgba(255,118,38,.25)}
    h1{margin:0;font-size:clamp(29px,7vw,43px);line-height:1.12;letter-spacing:-.035em}
    p{margin:18px 0 0;color:#adb8c7;font-size:clamp(17px,4.2vw,20px);line-height:1.55}
  </style>
</head>
<body>
  <main>
    <div class="segno" aria-hidden="true">✓</div>
    <h1>La sperimentazione è terminata.</h1>
    <p>Grazie per aver partecipato.</p>
  </main>
</body>
</html>
